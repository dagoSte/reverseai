    <text x="720" y="270">CF FA ED FE 0C 00 00 01  00 00 00 00 02 00 00 00</text>
    <text x="720" y="310">1F 8B 08 00 00 00 00 00  00 03 ED 9D 5B 73 DB 38</text>
    <text x="720" y="350">7F 45 4C 46 02 01 01 00  00 00 00 00 00 00 00 00</text>
