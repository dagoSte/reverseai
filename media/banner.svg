<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="title desc">
  <title id="title">ReverseAI</title>
  <desc id="desc">ReverseAI: look inside untrusted files without running them. Open reverse-engineering tools run in locked, offline containers, and every finding points at exact bytes.</desc>
  <defs>
    <linearGradient id="bannerBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101C35"/>
      <stop offset="1" stop-color="#070D1A"/>
    </linearGradient>
    <radialGradient id="bannerGlow" cx="0.2" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hexFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="markInk" gradientUnits="userSpaceOnUse" x1="120" y1="96" x2="404" y2="420">
