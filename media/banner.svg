  <rect x="1" y="1" width="1278" height="398" rx="27" fill="none" stroke="#38BDF8" stroke-opacity="0.28" stroke-width="2"/>
  <g transform="translate(72 80) scale(0.47)">
    <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#markTile)"/>
    <rect x="18" y="18" width="476" height="476" rx="110" fill="none" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="4"/>
