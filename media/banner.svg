      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" rx="28" fill="url(#bannerBg)"/>
  <rect width="1280" height="400" rx="28" fill="url(#bannerGlow)"/>
