  <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="344" y="178" font-size="92" font-weight="800" fill="#F8FAFC" letter-spacing="-2">Reverse<tspan fill="url(#wordInk)">AI</tspan></text>
    <text x="348" y="232" font-size="30" font-weight="600" fill="#E2E8F0">Look inside untrusted files without running them.</text>
    <text x="348" y="272" font-size="22" fill="#94A3B8">Open reverse-engineering tools in locked, offline containers.</text>
    <text x="348" y="302" font-size="22" fill="#94A3B8">Every finding points at exact bytes, checked twice.</text>
