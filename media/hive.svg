      .s { font-size: 12.5px; fill: #a5b4cc; }
      .n { font-size: 12px; font-weight: 700; fill: #0b1220; }
      .k { font-size: 12px; fill: #cbd5e1; }
      .hx { font-size: 12px; font-weight: 700; fill: #0b1220; }
      .chip { font-size: 13px; font-weight: 700; fill: #0b1220; }
      .flow { stroke: #7dd3fc; stroke-width: 2.2; fill: none; }
      .back { stroke: #f59e0b; stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
      .tag { font-size: 11.5px; font-style: italic; fill: #fbbf24; }
      .box { fill: url(#card); stroke: #2c3b5e; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1280" height="820" rx="22" fill="url(#bg)"/>
  <text x="40" y="52" style="font-size:26px;font-weight:800;fill:#f8fafc">The hive: an AI analyst team that rebuilds programs</text>
  <text x="40" y="78" class="s" style="font-size:14px">A queen in code, parallel bees on ReverseAI evidence, an independent council, and a checker that keeps the final word.</text>
  <g>
    <rect class="box" x="30" y="110" width="180" height="128" rx="14"/>
    <circle cx="52" cy="132" r="12" fill="#7dd3fc"/><text x="52" y="136" class="n" text-anchor="middle">1</text>
    <text x="72" y="138" class="h">Program</text>
    <text x="50" y="166" class="s">approved file</text>
    <text x="50" y="185" class="s">analysed as data</text>
    <text x="50" y="204" class="s">native: ELF · PE · Mach-O</text>
  </g>
  <g>
    <rect class="box" x="250" y="110" width="250" height="128" rx="14"/>
    <circle cx="272" cy="132" r="12" fill="#7dd3fc"/><text x="272" y="136" class="n" text-anchor="middle">2</text>
    <text x="292" y="138" class="h">Survey</text>
    <text x="270" y="166" class="s">Ghidra analyses it once,</text>
    <text x="270" y="185" class="s">in its locked container</text>
    <text x="270" y="204" class="s">map: functions · calls · strings</text>
  </g>
  <g>
    <rect class="box" x="540" y="110" width="250" height="128" rx="14"/>
    <circle cx="562" cy="132" r="12" fill="#f59e0b"/><text x="562" y="136" class="n" text-anchor="middle">3</text>
    <text x="582" y="138" class="h">Pre-flight</text>
    <text x="560" y="166" class="s">packer names · entropy</text>
    <text x="560" y="185" class="s">loader-only imports</text>
    <text x="560" y="204" class="s">packed? stop before spending</text>
  </g>
  <g>
    <rect x="830" y="110" width="420" height="128" rx="14" fill="url(#queen)" stroke="#f59e0b" stroke-width="1.8"/>
    <circle cx="852" cy="132" r="12" fill="#fbbf24"/><text x="852" y="136" class="n" text-anchor="middle">4</text>
    <text x="872" y="138" class="h">Queen</text><text x="932" y="138" class="tag">Python code, not a model</text>
    <text x="850" y="166" class="s">plans with one planner bee, freezes contract.h / .hpp</text>
    <text x="850" y="185" class="s">C or C++ · modules of related functions · budgets</text>
    <text x="850" y="204" class="s">compiles, links, runs the checks, computes the verdict</text>
    <text x="850" y="223" class="s" style="fill:#fcd34d">never writes code, never votes, cannot overrule a check</text>
  </g>
