<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="1280" height="820" role="img" aria-labelledby="title desc">
  <title id="title">The hive: an AI analyst team that rebuilds programs from ReverseAI evidence</title>
  <desc id="desc">A program is prepared once with Ghidra and exported as a map of functions, calls and strings. A pre-flight stops packed programs before any agent is spent. The queen, which is code and not a model, plans with one planner agent, freezes the shared contract header and schedules builder bees in parallel, one module each, each with its own ReverseAI MCP server and a folder it alone can write. Claude and Codex bees can alternate. An independent council of three non-authors per module tries to refute each module against the assembly; only evidenced differences count and go back for repair. The queen compiles and links from a clean stage, a deterministic evidence checker re-runs every cited question, and, only when allowed, the original and the rebuild run the same conformance cases. Code computes the verdict: accepted, disputed or not accepted.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111c33"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2742"/><stop offset="1" stop-color="#16203a"/></linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14532d"/><stop offset="1" stop-color="#0f3d22"/></linearGradient>
    <linearGradient id="queen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b2a0b"/><stop offset="1" stop-color="#2a1e09"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7dd3fc"/></marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker>
    <style>
